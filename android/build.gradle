plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def webAppUrl = project.findProperty('WEB_APP_URL') ?: 'https://YOUR-DOG-AI-VERCEL-DOMAIN.vercel.app/'

android {
    namespace 'com.dogai.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dogai.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'WEB_APP_URL', '"' + webAppUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
}
