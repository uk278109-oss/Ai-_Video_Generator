<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Video Generator</title>

  <!-- Firebase: replace YOUR_* values with your Firebase Web App config -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #08111f;
      color: #fff;
    }

    .app {
      width: min(900px, 100%);
      margin: auto;
      padding: 20px;
    }

    .hero {
      padding: 28px 20px;
      border: 1px solid #24354f;
      border-radius: 24px;
      background:
        radial-gradient(circle at top right, rgba(56,189,248,.22), transparent 30%),
        linear-gradient(135deg, #0e1b31, #111827);
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      font-size: 30px;
      border-radius: 18px;
      background: linear-gradient(135deg, #0284c7, #7c3aed);
    }

    h1 { margin: 0; font-size: 28px; }
    .sub { color: #b8c4d6; line-height: 1.6; }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 20px 0;
    }

    .tab {
      border: 1px solid #334155;
      background: #111827;
      color: white;
      padding: 14px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .tab.active {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border-color: transparent;
    }

    .card {
      background: #101827;
      border: 1px solid #24354f;
      border-radius: 20px;
      padding: 20px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #334155;
      background: #08111f;
      color: white;
      font-size: 16px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #08111f;
      color: white;
      font-size: 15px;
    }

    .generate {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #0284c7, #7c3aed);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #status {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #172033;
      border: 1px solid #334155;
      color: #cbd5e1;
    }

    #result {
      display: none;
      margin-top: 22px;
    }

    video, #outputImage {
      width: 100%;
      max-height: 600px;
      object-fit: contain;
      background: #000;
      border-radius: 16px;
      border: 1px solid #334155;
    }

    .download {
      display: inline-block;
      margin-top: 14px;
      padding: 13px 18px;
      border-radius: 12px;
      background: #16a34a;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .warning {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: #3b2a0c;
      color: #fde68a;
      font-size: 14px;
      line-height: 1.5;
    }

    .account {
      margin-top: 14px;
      color: #94a3b8;
      font-size: 13px;
    }

    @media(max-width:600px) {
      .options { grid-template-columns: 1fr; }
      h1 { font-size: 23px; }
    }
  </style>
</head>

<body>

<div class="app">

  <section class="hero">
    <div class="brand">
      <div class="logo">🎬</div>

      <div>
        <h1>AI Video Generator</h1>
        <div class="sub">
          Create AI images and videos from your imagination.
        </div>
      </div>
    </div>

    <div class="account" id="accountStatus">
      Connecting account...
    </div>
  </section>

  <div class="tabs">
    <button class="tab active" id="imageTab">🖼️ Generate Image</button>
    <button class="tab" id="videoTab">🎬 Generate Video</button>
  </div>

  <section class="card">

    <label for="prompt">✨ Describe what you want</label>

    <textarea
      id="prompt"
      placeholder="Example: A futuristic city at night, flying cars, cinematic lighting, highly detailed..."
    ></textarea>

    <div class="options">

      <div>
        <label for="ratio">📐 Aspect Ratio</label>

        <select id="ratio">
          <option value="1:1">1:1 Square</option>
          <option value="16:9">16:9 Landscape</option>
          <option value="9:16">9:16 Portrait</option>
        </select>
      </div>

      <div id="durationBox" style="display:none;">
        <label for="duration">⏱️ Duration</label>

        <select id="duration">
          <option value="3">3 Seconds</option>
          <option value="5">5 Seconds</option>
        </select>
      </div>

    </div>

    <button class="generate" id="generateBtn">
      🚀 Generate Image
    </button>

    <div id="status"></div>

    <div id="result">

      <h3 id="resultTitle">🎉 Your Result Is Ready!</h3>

      <img id="outputImage" style="display:none;" alt="Generated AI image">

      <video
        id="outputVideo"
        style="display:none;"
        controls
        playsinline
      ></video>

      <br>

      <a
        id="downloadBtn"
        class="download"
        href="#"
        download
        target="_blank"
      >
        ⬇️ Download
      </a>

      <div class="warning">
        ⚠️ Please download your result and save it to your device.
        Generated files may be temporary and can become unavailable later.
      </div>

    </div>

  </section>

</div>

<script>
  /*
   * Firebase
   * Replace these values with your own Firebase Web App config.
   */

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  let firebaseReady = false;
  let db = null;
  let auth = null;

  try {
    if (!firebaseConfig.apiKey.startsWith("YOUR_")) {
      firebase.initializeApp(firebaseConfig);

      auth = firebase.auth();
      db = firebase.firestore();

      auth.signInAnonymously()
        .then(() => {
          firebaseReady = true;
          document.getElementById("accountStatus").textContent =
            "✓ Connected";
        })
        .catch(() => {
          document.getElementById("accountStatus").textContent =
            "Guest mode";
        });
    } else {
      document.getElementById("accountStatus").textContent =
        "Guest mode — Firebase not configured yet";
    }
  } catch (error) {
    console.error(error);

    document.getElementById("accountStatus").textContent =
      "Guest mode";
  }


  let mode = "image";

  const imageTab = document.getElementById("imageTab");
  const videoTab = document.getElementById("videoTab");

  const durationBox =
    document.getElementById("durationBox");

  const generateBtn =
    document.getElementById("generateBtn");

  const promptInput =
    document.getElementById("prompt");

  const ratioInput =
    document.getElementById("ratio");

  const durationInput =
    document.getElementById("duration");

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");

  const outputImage =
    document.getElementById("outputImage");

  const outputVideo =
    document.getElementById("outputVideo");

  const downloadBtn =
    document.getElementById("downloadBtn");


  imageTab.onclick = () => {
    mode = "image";

    imageTab.classList.add("active");
    videoTab.classList.remove("active");

    durationBox.style.display = "none";

    generateBtn.textContent =
      "🚀 Generate Image";

    outputVideo.pause();
    result.style.display = "none";
  };


  videoTab.onclick = () => {
    mode = "video";

    videoTab.classList.add("active");
    imageTab.classList.remove("active");

    durationBox.style.display = "block";

    generateBtn.textContent =
      "🚀 Generate Video";

    result.style.display = "none";
  };


  function showStatus(message) {
    status.style.display = "block";
    status.textContent = message;
  }


  async function saveHistory(type, prompt, ratio, duration) {

    if (!firebaseReady || !auth || !db || !auth.currentUser) {
      return;
    }

    try {
      await db
        .collection("users")
        .doc(auth.currentUser.uid)
        .collection("generations")
        .add({
          type,
          prompt,
          ratio,
          duration: duration || null,
          createdAt:
            firebase.firestore.FieldValue.serverTimestamp()
        });

    } catch (error) {
      console.error("History save error:", error);
    }
  }


  generateBtn.onclick = async () => {

    const prompt = promptInput.value.trim();

    if (!prompt) {
      alert("Please enter a prompt first.");
      promptInput.focus();
      return;
    }

    generateBtn.disabled = true;

    result.style.display = "none";

    outputImage.style.display = "none";
    outputVideo.style.display = "none";

    const endpoint =
      mode === "image"
        ? "/api/generate-image"
        : "/api/generate-video";

    const body = {
      prompt,
      ratio: ratioInput.value
    };

    if (mode === "video") {
      body.duration =
        Number(durationInput.value);
    }

    try {

      showStatus(
        mode === "image"
          ? "🎨 AI image is being generated..."
          : "🎬 AI video is being generated..."
      );

      const response =
        await fetch(endpoint, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(body)
        });


      if (!response.ok) {

        let message =
          "Generation failed. Please try again.";

        try {
          const data =
            await response.json();

          message =
            data.error || message;

        } catch (_) {}

        throw new Error(message);
      }


      const blob =
        await response.blob();

      const url =
        URL.createObjectURL(blob);


      if (mode === "image") {

        outputImage.src = url;

        outputImage.style.display =
          "block";

        document.getElementById(
          "resultTitle"
        ).textContent =
          "🎉 Your AI Image Is Ready!";

        downloadBtn.download =
          "ai-image.png";

      } else {

        outputVideo.src = url;

        outputVideo.style.display =
          "block";

        document.getElementById(
          "resultTitle"
        ).textContent =
          "🎉 Your AI Video Is Ready!";

        downloadBtn.download =
          "ai-video.mp4";
      }


      downloadBtn.href = url;

      result.style.display =
        "block";

      status.style.display =
        "none";


      await saveHistory(
        mode,
        prompt,
        ratioInput.value,
        mode === "video"
          ? Number(durationInput.value)
          : null
      );


      result.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    } catch (error) {

      console.error(error);

      showStatus(
        "❌ " +
        (error.message ||
          "Generation failed. Please try again.")
      );

    } finally {

      generateBtn.disabled =
        false;
    }
  };
</script>

</body>
</html>
